name: Собрать приложение для Android (APK)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Собрать ядро соединения (libXray.aar)
        env:
          LIBXRAY_REF: "v26.7.28"
        run: |
          set -e
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$ANDROID_NDK_HOME"
          git clone --depth 1 --branch "$LIBXRAY_REF" https://github.com/XTLS/libXray /tmp/libxray
          cd /tmp/libxray
          go mod download
          gomobile init
          gomobile bind -target android/arm64,android/arm -androidapi 21 -trimpath \
            -ldflags="-checklinkname=0 -s -w" -o libXray.aar github.com/xtls/libxray
          mkdir -p "$GITHUB_WORKSPACE/android/app/libs"
          cp libXray.aar "$GITHUB_WORKSPACE/android/app/libs/libXray.aar"
          ls -lh "$GITHUB_WORKSPACE/android/app/libs/libXray.aar"
          echo "== классы ядра =="; unzip -o -q libXray.aar classes.jar -d /tmp/lx && unzip -l /tmp/lx/classes.jar | grep -iE "libxray|LibXray" | head -20 || true

      - name: Собрать APK
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace > build.log 2>&1 || {
            grep -E "^e: |error:|What went wrong" -A2 build.log | grep -v "^--$" | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
            tail -n 80 build.log; exit 1; }
          ls -lh android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk Lumo.apk

      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${{ github.run_number }}"
          gh release create "$TAG" Lumo.apk --title "Lumo для Android — сборка ${{ github.run_number }}" \
            --notes "Lumo для Android, бета-версия 1.0." --latest=false
