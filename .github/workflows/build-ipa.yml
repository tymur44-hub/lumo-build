name: Собрать IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Создать Xcode-проект
        run: xcodegen generate

      - name: Собрать приложение
        run: |
          set -o pipefail
          xcodebuild -project Lumo.xcodeproj -scheme Lumo -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l//$'\n'/ }"; done; tail -n 80 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -20 || true
          test -d build/Build/Products/Release-iphoneos/Lumo.app

      - name: Упаковать IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lumo.app Payload/
          zip -qry Lumo.ipa Payload
          ls -lh Lumo.ipa

      - name: Файл IPA (вкладка Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-ipa
          path: Lumo.ipa

      - name: Выложить в Releases (постоянная ссылка)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Lumo.ipa --title "Lumo для iPhone (сборка ${{ github.run_number }})" \
            --notes "Неподписанный IPA. Установка: Sideloadly / AltStore со своим Apple ID." --latest
