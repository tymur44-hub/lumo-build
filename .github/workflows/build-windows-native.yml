name: build-windows-native
on: workflow_dispatch
jobs:
  win:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: microsoft/setup-msbuild@v2
      - name: Сборка
        working-directory: windows/Lumo
        shell: pwsh
        run: msbuild Lumo.csproj /restore /t:Publish /m /v:m /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true "/p:PublishDir=$((Resolve-Path ..).Path)\out\"
      - name: Проверка запуска
        shell: pwsh
        working-directory: windows/out
        run: |
          $p = Start-Process -FilePath .\Lumo.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Host "Lumo exited with code $($p.ExitCode)"
            Get-Content "$env:LOCALAPPDATA\Lumo\log.txt" -ErrorAction SilentlyContinue
            Get-ChildItem -Name | Where-Object { $_ -match '\.(pri|xbf|exe|json)$' -or $_ -match '^Microsoft\.(UI|Windows)' } | Select-Object -First 60
            Get-WinEvent -LogName Application -MaxEvents 15 | Where-Object { $_.LevelDisplayName -eq 'Error' } | Format-List TimeCreated,ProviderName,Message
            exit 1
          }
          Write-Host "SMOKE-OK"
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:GITHUB_WORKSPACE\screen.png")
          Get-Content "$env:LOCALAPPDATA\Lumo\log.txt" -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with: { name: screen, path: screen.png }
      - name: Архив и установщик
        shell: pwsh
        run: |
          Compress-Archive -Path windows/out/* -DestinationPath Lumo-Windows-x64.zip
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /Qp windows/installer.iss
          Get-ChildItem windows/dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-native-${{ github.run_number }}
          name: Lumo для Windows (нативное) ${{ github.run_number }}
          files: |
            Lumo-Windows-x64.zip
            windows/dist/Lumo-Setup.exe
