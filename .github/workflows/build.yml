# Проверка сборки: запускается при каждом изменении кода. Аккаунт Apple не нужен.
name: Сборка

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Собрать для симулятора
        run: |
          set -o pipefail
          xcodebuild \
            -project MSReport.xcodeproj \
            -scheme MSReport \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Проверить, что все файлы скомпилированы
        run: |
          echo "Скомпилированные файлы Swift:"
          grep -oE "[A-Za-z]+\.swift" build.log | grep -E "^[A-Z]" | sort -u
          grep -q "ReportBuilder.swift" build.log
          grep -q "AppIcon" build.log && echo "Иконка: есть"

      - name: Сохранить лог сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
