<circle class="hw-ember" style="--dx:14px;--dy:-160px;animation-delay:-1.9s" cx="380" cy="652" r="3" fill="#ffe0a8"/>

<rect width="800" height="800" rx="64" fill="url(#hwvig)"/>
<rect x="14" y="14" width="772" height="772" rx="56" fill="none" stroke="url(#hwrim)" stroke-width="3"/>
<text x="400" y="708" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="800" font-size="46" fill="#fff">Фонарь Джека</text>
