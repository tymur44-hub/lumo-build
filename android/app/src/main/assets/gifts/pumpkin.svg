<path class="hw-bat" style="animation-delay:-3.2s" d="M23 12 C19 2 6 0 0 8 C7 9 13 11 18 15 C13 13 6 15 2 20 C10 20 17 17 23 12 C29 17 36 20 44 20 C40 15 33 13 28 15 C33 11 39 9 46 8 C40 0 27 2 23 12 Z" fill="#150a22" transform="translate(40,340) scale(1)"/>

