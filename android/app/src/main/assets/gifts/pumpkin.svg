      <path d="M186 122 C201 156 203 216 183 278" stroke="#c9550a" stroke-width="4" fill="none" opacity=".55" stroke-linecap="round"/>
      <ellipse cx="90" cy="156" rx="34" ry="48" fill="#ffd79a" opacity=".32"/>
      <clipPath id="hwbodyclip"><path d="M130 112 C92 110 54 120 40 156 C27 186 30 221 47 246 C65 274 97 290 130 290 C163 290 195 274 213 246 C230 221 233 186 220 156 C206 120 168 110 130 112 Z"/></clipPath>
      <g clip-path="url(#hwbodyclip)"><g class="hw-sweep"><polygon points="20,80 70,80 130,310 80,310" fill="url(#hwshine)" opacity=".5"/></g></g>
      <g>
        <path d="M70 174 L96 174 L83 206 Z" fill="url(#hwface)"/>
        <path d="M190 174 L164 174 L177 206 Z" fill="url(#hwface)"/>
        <path d="M122 208 L130 222 L138 208 Z" fill="url(#hwface)"/>
        <path d="M62 238 C80 258 100 266 130 264 C160 266 180 258 198 238 C192 250 176 266 155 270 L148 260 L138 272 L130 260 L122 272 L112 260 L105 270 C84 266 68 250 62 238 Z" fill="url(#hwface)"/>
      </g>
      <g class="hw-flicker" fill="none" stroke="#5a2406" stroke-width="3" stroke-linejoin="round">
        <path d="M70 174 L96 174 L83 206 Z"/>
        <path d="M190 174 L164 174 L177 206 Z"/>
        <path d="M122 208 L130 222 L138 208 Z"/>
        <path d="M62 238 C80 258 100 266 130 264 C160 266 180 258 198 238 C192 250 176 266 155 270 L148 260 L138 272 L130 260 L122 272 L112 260 L105 270 C84 266 68 250 62 238 Z"/>
      </g>
      <path d="M130 112 C92 110 54 120 40 156 C27 186 30 221 47 246 C65 274 97 290 130 290 C163 290 195 274 213 246 C230 221 233 186 220 156 C206 120 168 110 130 112 Z" fill="none" stroke="#7a3406" stroke-width="3" opacity=".6"/>
    </g>
  </g>
</g>

<circle class="hw-ember" style="--dx:16px;--dy:-170px;animation-delay:-.3s" cx="340" cy="640" r="5" fill="#ffb15a"/>
<circle class="hw-ember" style="--dx:-18px;--dy:-190px;animation-delay:-1.4s" cx="420" cy="648" r="4" fill="#ffcf8a"/>
