<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800"><style>
.hw-fall{animation:hwfall 6.4s cubic-bezier(.36,.07,.19,.97) infinite;transform-origin:50% 100%}
@keyframes hwfall{0%{transform:translateY(-360px) scale(.4);opacity:0;filter:brightness(2) blur(4px)}5%{opacity:1;filter:brightness(2) blur(0px)}8%{transform:translateY(-320px) scale(.55);filter:brightness(1.3)}26%{transform:translateY(0) scale(1);filter:brightness(1)}29%{transform:translateY(4px) scaleX(1.18) scaleY(.82)}33%{transform:translateY(-26px) scaleX(.94) scaleY(1.08)}38%{transform:translateY(6px) scaleX(1.06) scaleY(.96)}44%{transform:translateY(0) scale(1)}80%{transform:translateY(0) scale(1);opacity:1}92%{transform:translateY(-420px) scale(.5);opacity:0}100%{transform:translateY(-420px) scale(.5);opacity:0}}
.hw-impact{animation:hwimpact 6.4s ease-out infinite;transform-origin:400px 610px}
@keyframes hwimpact{0%,27%{opacity:0;transform:scale(.3)}29%{opacity:.55;transform:scale(1)}38%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
.hw-halo{animation:hwpulse 3.2s ease-in-out infinite}
@keyframes hwpulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.85;transform:scale(1.08)}}
.hw-flicker{animation:hwflicker 3.2s ease-in-out infinite}
@keyframes hwflicker{0%,100%{opacity:1}42%{opacity:.7}58%{opacity:1}80%{opacity:.86}}
.hw-ember{animation:hwember 3.2s linear infinite;opacity:0}
@keyframes hwember{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.15)}}
.hw-tw{animation:hwtw 3.2s ease-in-out infinite}
@keyframes hwtw{0%,100%{opacity:.25}50%{opacity:1}}
.hw-sweep{animation:hwsweep 6.4s ease-in-out infinite}
@keyframes hwsweep{0%,35%{transform:translateX(-300px)}75%,100%{transform:translateX(300px)}}
.hw-bat{animation:hwbat 6.4s linear infinite}
@keyframes hwbat{0%{transform:translate(-60px,0) scale(.8);opacity:0}10%{opacity:1}50%{transform:translate(420px,-60px) scale(1.05)}90%{opacity:1}100%{transform:translate(900px,-10px) scale(.9);opacity:0}}
</style>
<defs>
<linearGradient id="hwbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a1457"/><stop offset="1" stop-color="#0a0613"/></linearGradient>
<radialGradient id="hwgl" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#8c3ce6" stop-opacity=".8"/><stop offset="1" stop-color="#8c3ce6" stop-opacity="0"/></radialGradient>
<radialGradient id="hwbody" cx="38%" cy="30%" r="72%"><stop offset="0%" stop-color="#ffb15a"/><stop offset="45%" stop-color="#ff8a21"/><stop offset="80%" stop-color="#e8690b"/><stop offset="100%" stop-color="#b94f08"/></radialGradient>
<radialGradient id="hwface" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#fff3c4"/><stop offset="55%" stop-color="#ffd27a"/><stop offset="100%" stop-color="#ff8a21"/></radialGradient>
<radialGradient id="hwvig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<linearGradient id="hwrim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient>
<linearGradient id="hwshine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="hwblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
<clipPath id="hwface-clip"><circle cx="400" cy="420" r="230"/></clipPath>
</defs>

<rect width="800" height="800" rx="64" fill="url(#hwbg)"/>
<circle class="hw-halo" cx="400" cy="360" r="320" fill="url(#hwgl)"/>

<g fill="#fff">
