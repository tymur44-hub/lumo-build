<polygon class="hw-tw" style="animation-delay:-.4s" points="620,220 624,230 634,231 626,238 629,248 620,242 611,248 614,238 606,231 616,230" opacity=".7"/>
</g>

<circle cx="610" cy="150" r="68" fill="#f6e8c7" opacity=".95"/>
