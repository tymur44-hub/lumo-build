# Сборка Lumo в Codemagic (бесплатно ~500 минут в месяц).
# Запуск: на сайте Codemagic выберите репозиторий и нужный workflow, нажмите Start new build.
workflows:
  lumo-android:
    name: Lumo для Android (APK)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      vars:
        LIBXRAY_REF: "v26.7.28"
        GRADLE_VERSION: "8.9"
        GO_VERSION: "1.23.4"
    scripts:
      - name: Установить Go, Gradle и NDK
        script: |
          set -e
          curl -sSL https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz | tar -C $HOME -xz
          export PATH="$HOME/go/bin:$PATH"
          curl -sSL https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d $HOME && export PATH="$HOME/gradle-${GRADLE_VERSION}/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
          echo "export PATH=$HOME/go/bin:$HOME/gradle-${GRADLE_VERSION}/bin:\$PATH" >> $HOME/.env_lumo
      - name: Собрать ядро соединения (libXray.aar)
        script: |
          set -e
          source $HOME/.env_lumo
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          git clone --depth 1 --branch "$LIBXRAY_REF" https://github.com/XTLS/libXray /tmp/libxray
          cd /tmp/libxray
          go mod download
          gomobile init
          gomobile bind -target android/arm64,android/arm -androidapi 21 -trimpath \
            -ldflags="-checklinkname=0 -s -w" -o libXray.aar github.com/xtls/libxray
          mkdir -p "$CM_BUILD_DIR/android/app/libs"
          cp libXray.aar "$CM_BUILD_DIR/android/app/libs/libXray.aar"
      - name: Собрать APK
        script: |
          set -e
          source $HOME/.env_lumo
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Lumo.apk
    artifacts:
      - Lumo.apk

  lumo-ios:
    name: Lumo для iPhone (IPA без подписи)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        LIBXRAY_REF: "v26.7.28"
        GOTOOLCHAIN: "auto"
    scripts:
      - name: Установить Go и XcodeGen
        script: |
          brew install go xcodegen
          go version
      - name: Собрать ядро соединения (LibXray.xcframework)
        script: |
          set -e
          git clone --depth 1 --branch "$LIBXRAY_REF" https://github.com/XTLS/libXray /tmp/libxray
          cd /tmp/libxray
          go mod download
          slice() {
            local GA="$1"; local SDK="$2"; local AA="$3"
            local OUT="/tmp/fx/$SDK-$AA"
            mkdir -p "$OUT"
            local SYS; SYS=$(xcrun --sdk "$SDK" --show-sdk-path)
            GOOS=ios GOARCH=$GA CGO_ENABLED=1 GOFLAGS=-tags=ios \
              CC="xcrun --sdk $SDK clang" CXX="xcrun --sdk $SDK clang++" \
              CGO_CFLAGS="-isysroot $SYS -m$SDK-version-min=15.0 -arch $AA" \
              CGO_LDFLAGS="-isysroot $SYS -m$SDK-version-min=15.0 -arch $AA -Wl,-Bsymbolic-functions" \
              go build -trimpath -ldflags "-s -w -buildid=" -o "$OUT/libXray.a" -buildmode=c-archive ./cgo_bridge
          }
          slice arm64 iphoneos arm64
          slice arm64 iphonesimulator arm64
          slice amd64 iphonesimulator x86_64
          mkdir -p /tmp/fx/sim
          lipo -create -arch arm64 /tmp/fx/iphonesimulator-arm64/libXray.a \
                       -arch x86_64 /tmp/fx/iphonesimulator-x86_64/libXray.a \
                       -output /tmp/fx/sim/libXray.a
          mkdir -p /tmp/inc-dev /tmp/inc-sim
          cp /tmp/fx/iphoneos-arm64/libXray.h /tmp/inc-dev/
          cp /tmp/fx/iphonesimulator-arm64/libXray.h /tmp/inc-sim/
          cp build/template/module.modulemap /tmp/inc-dev/
          cp build/template/module.modulemap /tmp/inc-sim/
          rm -rf "$CM_BUILD_DIR/native/Frameworks/LibXray.xcframework"
          mkdir -p "$CM_BUILD_DIR/native/Frameworks"
          xcodebuild -create-xcframework \
            -library /tmp/fx/iphoneos-arm64/libXray.a -headers /tmp/inc-dev \
            -library /tmp/fx/sim/libXray.a -headers /tmp/inc-sim \
            -output "$CM_BUILD_DIR/native/Frameworks/LibXray.xcframework"
      - name: Собрать приложение и упаковать IPA
        script: |
          set -e
          cd native
          xcodegen generate
          xcodebuild -project LumoNative.xcodeproj -scheme Lumo -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -clonedSourcePackagesDirPath spm \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lumo.app Payload/
          zip -qry ../LumoNative.ipa Payload
    artifacts:
      - LumoNative.ipa
