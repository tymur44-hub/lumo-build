<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800"><style>
:root{--e:cubic-bezier(.45,0,.55,1)}
[class]{transform-box:fill-box}
.tw{animation:tw 4s var(--e) infinite;transform-origin:center}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1.3)}}
.tw2{animation:tw 2s var(--e) infinite;transform-origin:center}
.bob{animation:bob 4s var(--e) infinite}
@keyframes bob{0%,100%{transform:translateY(10px)}50%{transform:translateY(-14px)}}
.rays{animation:rays 4s linear infinite;transform-origin:400px 360px;transform-box:view-box}
@keyframes rays{to{transform:rotate(45deg)}}
.halo{animation:halo 4s var(--e) infinite;transform-origin:center}
@keyframes halo{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.1)}}
.rise{animation:rise 4s linear infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.4)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
.sweep{animation:sweep 4s var(--e) infinite}
@keyframes sweep{0%,35%{transform:translateX(-420px)}75%,100%{transform:translateX(420px)}}
.spin{animation:spin 8s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.spinr{animation:spin 4s linear infinite reverse;transform-origin:center}
.breathe{animation:br 4s var(--e) infinite;transform-origin:center}
@keyframes br{0%,100%{transform:scale(.94)}50%{transform:scale(1.06)}}
.sway{animation:sway 4s var(--e) infinite;transform-origin:center}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.flash{animation:flash 4s var(--e) infinite}
@keyframes flash{0%,100%{opacity:0}50%{opacity:.8}}
.flash2{animation:flash 4s var(--e) infinite;animation-delay:-1s}
.flash3{animation:flash 4s var(--e) infinite;animation-delay:-2s}
.flash4{animation:flash 4s var(--e) infinite;animation-delay:-3s}
.ring{animation:ring 4s ease-out infinite;transform-origin:center}
@keyframes ring{0%{opacity:.7;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
.lid{animation:lid 4s var(--e) infinite;transform-origin:0% 100%}
@keyframes lid{0%,100%{transform:rotate(0)}20%,80%{transform:rotate(-42deg)}}
.pearl{animation:pearl 4s var(--e) infinite}
@keyframes pearl{0%,100%{transform:translateY(40px) scale(.9)}25%,75%{transform:translateY(-34px) scale(1.05)}}
.pglow{animation:pg 4s var(--e) infinite}
@keyframes pg{0%,100%{opacity:0}30%,70%{opacity:1}}
.trail{animation:trail 1s ease-in-out infinite;transform-origin:right center}
@keyframes trail{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.12)}}
.ember{animation:ember 2s linear infinite;opacity:0}
@keyframes ember{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.1)}}
.petal{animation:petal 4s var(--e) infinite;transform-origin:50% 100%}
@keyframes petal{0%,100%{transform:rotate(var(--a)) scale(.82)}50%{transform:rotate(var(--a)) scale(1.06)}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a0f2a"/><stop offset="1" stop-color="#1a0618"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff7a2b" stop-opacity=".8"/><stop offset="1" stop-color="#ff7a2b" stop-opacity="0"/></radialGradient>
<radialGradient id="ray" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 360) scale(520)"><stop offset="0" stop-color="#ff7a2b" stop-opacity=".9"/><stop offset="1" stop-color="#ff7a2b" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
